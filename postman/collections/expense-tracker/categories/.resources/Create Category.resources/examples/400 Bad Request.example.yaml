$kind: http-example
name: 400 Bad Request
request:
  url: '{{base_url}}/categories'
  method: POST
  body:
    type: json
    content: |-
      {
        "name": "",
        "receipt_threshold": -10
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "validation_error",
        "message": "name is required; receipt_threshold must be a positive number"
      }
