$kind: http-example
name: 401 Unauthorized
request:
  url: '{{base_url}}/categories'
  method: GET
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "unauthorized",
        "message": "A valid JWT Bearer token is required"
      }
