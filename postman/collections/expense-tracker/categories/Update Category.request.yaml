$kind: http-request
name: Update Category
method: PUT
url: '{{base_url}}/categories/:category_id'
order: 4000
pathVariables:
  - key: category_id
    value: cat_01
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Travel",
      "description": "Flights, hotels, ground transport and taxis",
      "receipt_threshold": 75.00,
      "currency": "USD"
    }
examples: './.resources/Update Category.resources/examples/'
