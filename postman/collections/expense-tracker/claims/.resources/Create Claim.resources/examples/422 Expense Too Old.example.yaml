$kind: http-example
name: '422 Expense Too Old'
request:
  url: '{{base_url}}/claims'
  method: POST
  body:
    type: json
    content: |-
      {
        "title": "Old Expenses Claim",
        "expense_ids": ["exp_old"]
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "expense_too_old",
        "message": "Expense exp_old is older than 90 days and cannot be added to a claim"
      }
