$kind: http-example
name: 404 Not Found
request:
  url: '{{base_url}}/expenses/exp_999'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "not_found",
        "message": "Expense exp_999 does not exist"
      }
